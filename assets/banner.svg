<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="dsh-windows-control — Windows desktop automation for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#132340"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2c4d"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#20304f"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1080" cy="60" r="180" fill="#4d8dff" opacity="0.07"/>
  <circle cx="960" cy="280" r="140" fill="#8b5cf6" opacity="0.07"/>

  <!-- wordmark -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <text x="72" y="112" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="-0.5">dsh-windows-control</text>
    <rect x="72" y="134" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="176" fill="#9db2d4" font-size="19">让 DeepSeek Harness 的 agent 真正看见、并操作你的 Windows 桌面</text>
    <g fill="#5f7699" font-size="14" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
      <text x="72" y="236">screenshot</text>
      <text x="178" y="236">click</text>
      <text x="240" y="236">type</text>
      <text x="300" y="236">shortcut</text>
      <text x="392" y="236">clipboard</text>
      <text x="492" y="236">process</text>
      <text x="576" y="236">registry</text>
    </g>
  </g>

  <!-- soft glow behind the monitor -->
  <circle cx="900" cy="150" r="140" fill="#4d8dff" opacity="0.05"/>

  <!-- monitor -->
  <g transform="translate(760 58)">
    <rect x="0" y="0" width="356" height="196" rx="14" fill="url(#screen)" stroke="#2c4470" stroke-width="2"/>
    <rect x="16" y="16" width="324" height="150" rx="8" fill="#0c1729" stroke="#22355a" stroke-width="1.5"/>
    <!-- title bar -->
    <rect x="16" y="16" width="324" height="22" rx="8" fill="#16233c"/>
    <circle cx="30" cy="27" r="3.4" fill="#3b5480"/>
    <circle cx="42" cy="27" r="3.4" fill="#3b5480"/>
    <circle cx="54" cy="27" r="3.4" fill="#3b5480"/>
    <!-- window content -->
    <rect x="32" y="52" width="120" height="9" rx="4.5" fill="#2b4370"/>
    <rect x="32" y="70" width="210" height="7" rx="3.5" fill="#1d3055"/>
    <rect x="32" y="86" width="176" height="7" rx="3.5" fill="#1d3055"/>
    <rect x="32" y="110" width="88" height="24" rx="6" fill="#1b2f52" stroke="#33507f" stroke-width="1"/>
    <rect x="132" y="110" width="88" height="24" rx="6" fill="#1b2f52" stroke="#33507f" stroke-width="1"/>
    <!-- cursor -->
    <g transform="translate(236 118)" filter="url(#glow)">
      <path d="M0 0 L0 26 L7 19 L12 29 L17 26.5 L12 17 L21 16 Z" fill="#ffffff" stroke="#0a1020" stroke-width="1.2"/>
    </g>
    <!-- stand -->
    <rect x="152" y="196" width="52" height="14" fill="#1a2a46"/>
    <rect x="112" y="210" width="132" height="9" rx="4.5" fill="#22355a"/>
  </g>
</svg>
