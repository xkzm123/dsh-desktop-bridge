<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-label="Computer Use 开关的位置与设置页入口">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2b47"/>
      <stop offset="1" stop-color="#18233a"/>
    </linearGradient>
  </defs>

  <rect width="920" height="350" fill="url(#bg3)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <!-- ① label -->
    <text x="40" y="26" fill="#5b8cff" font-size="13.5" font-weight="600">① 输入框工具行</text>
    <line x1="140" y1="34" x2="140" y2="50" stroke="#5b8cff" stroke-width="1.4" stroke-dasharray="3 3"/>

    <!-- composer mock -->
    <rect x="40" y="50" width="840" height="92" rx="16" fill="#141d31" stroke="#2a3c5c" stroke-width="1.5"/>
    <rect x="58" y="80" width="136" height="32" rx="16" fill="url(#pill)" stroke="#33507f" stroke-width="1.2"/>
    <circle cx="77" cy="96" r="4.5" fill="#34d399"/>
    <circle cx="77" cy="96" r="8.5" fill="#34d399" opacity="0.16"/>
    <g stroke="#cfe0ff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <rect x="92" y="88" width="14" height="10" rx="1.8"/>
      <line x1="96" y1="101" x2="102" y2="101"/>
      <line x1="99" y1="98" x2="99" y2="101"/>
    </g>
    <text x="114" y="101" fill="#dce8ff" font-size="13">Computer Use</text>

    <text x="214" y="101" fill="#4e5f7d" font-size="13.5">发消息或创建任务…</text>

    <circle cx="846" cy="96" r="16" fill="#1d2b47" stroke="#33507f" stroke-width="1.2"/>
    <path d="M839 96 h14 M846 89 v14" stroke="#7f95b8" stroke-width="1.4" stroke-linecap="round"/>

    <text x="58" y="166" fill="#64789b" font-size="12.5">绿点 = 已开启　·　灰点 = 已关闭　·　橙点 = 宿主连不上，或还没注册到桌面工具</text>

    <!-- ② settings mock -->
    <text x="344" y="210" fill="#a78bfa" font-size="13.5" font-weight="600">② 设置 → 桌面控制</text>
    <line x1="332" y1="218" x2="296" y2="232" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="3 3"/>

    <rect x="40" y="200" width="252" height="126" rx="12" fill="#141d31" stroke="#2a3c5c" stroke-width="1.5"/>
    <text x="60" y="224" fill="#55688a" font-size="11.5" letter-spacing="0.08em">设置</text>
    <text x="68" y="252" fill="#6d82a6" font-size="13">通用</text>
    <text x="68" y="278" fill="#6d82a6" font-size="13">插件</text>
    <rect x="54" y="286" width="224" height="28" rx="8" fill="#1d2742" stroke="#3a4a72" stroke-width="1"/>
    <rect x="54" y="286" width="3" height="28" rx="1.5" fill="#8b5cf6"/>
    <text x="68" y="305" fill="#e8f0ff" font-size="13" font-weight="600">桌面控制</text>

    <text x="344" y="244" fill="#8ea3c4" font-size="13">依赖安装 / 更新 / 回退、桥接参数、镜像策略、</text>
    <text x="344" y="266" fill="#8ea3c4" font-size="13">惰性工具开关 —— 全在这一页。</text>
    <text x="344" y="298" fill="#5c7093" font-size="12">插件自己的卡片（设置 → 插件 → 本插件）</text>
    <text x="344" y="316" fill="#5c7093" font-size="12">只留一行状态和一句指路，不重复放按钮。</text>
  </g>
</svg>
